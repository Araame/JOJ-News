{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 card shadow-sm p-4">
            <h2 class="mb-4">Suppression</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <p class="text-danger">Voulez-vous supprimer ce commentaire ?</p>
                </div>
                <button type="submit" class="btn btn-primary" w-100">Supprimer</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
