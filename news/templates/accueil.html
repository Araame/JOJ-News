{% extends "base.html" %}
{% load static %}

{% block content %}
<div id="carouselExample" class="carousel slide">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="{% static 'images/ayo.jpeg' %}" class="d-block w-100" alt="Mascotte JOJ 2026 AYO">
    </div>
    <div class="carousel-item">
      <img src="{% static 'images/art_femme.jpg' %}" class="d-block w-100" alt="Femmes sénégalaises">
    </div>
    <div class="carousel-item">
      <img src="{% static 'images/JOJ-2026.jpg' %}" class="d-block w-100" alt="Récapitulatif des pays invités des JOJ DAKAR 2026">
    </div>
    <div class="carousel-item">
      <img src="{% static 'images/ayo_pr.jpg' %}" class="d-block w-100" alt="Président du Sénégal et Ayo : mascotte des JOJ DAKAR 2026">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Précédent</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Suivant</span>
  </button>
</div>

{% endblock %}
